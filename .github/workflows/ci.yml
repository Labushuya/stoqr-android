name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync SvelteKit
        run: pnpm --filter @stoqr/web exec svelte-kit sync

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run typecheck

      # Tests brauchen KEINE DB mehr: die On-Device-App laeuft gegen SQLite,
      # die Query-Tests sind pur, der Schema-Parity-Test introspektiert nur die
      # Drizzle-Tabellen (kein Connect). Daher kein Postgres-Service noetig.
      - name: Run tests
        run: pnpm run test

  build-app:
    name: App-Bundle bauen (SPA-Target)
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Verifiziert, dass das statische SPA-Bundle (adapter-static) ohne
      # SSR-Fehler baut — das ist der Input fuer `cap sync`. build:app stasht
      # dabei die +*.server.ts, damit SvelteKit keine __data.json-Fetches
      # generiert (die es im SPA-Fallback nicht gibt).
      - name: Build (App-Target)
        run: pnpm --filter @stoqr/web run build:app

      - name: Upload SPA-Bundle als Artefakt
        uses: actions/upload-artifact@v4
        with:
          name: spa-bundle
          path: apps/web/build
          retention-days: 7
