name: Release

# Baut bei einem SemVer-Tag (v*) eine signierte Android-APK aus dem
# Capacitor-Projekt, testet vorher (Gate) und veroeffentlicht die APK als
# GitHub Release. Muster angelehnt an die uebrigen Android-Apps des Nutzers
# (Wickelfinder), adaptiert von Flutter auf Capacitor.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build, Test & Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Java (fuer Android-Build)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync SvelteKit
        run: pnpm --filter @stoqr/web exec svelte-kit sync

      # Gate zuerst — kein Release bei rotem Test / Typfehler.
      - name: Lint (Gate)
        run: pnpm run lint

      - name: Typecheck (Gate)
        run: pnpm run typecheck

      - name: Tests (Gate - kein Release bei rotem Test)
        run: pnpm run test

      # Statisches SPA-Bundle bauen (adapter-static), das die WebView laedt.
      # build:app stasht die +*.server.ts, damit SvelteKit keine __data.json-
      # Fetches erzeugt (im SPA-Fallback nicht vorhanden -> 404/blank).
      - name: App-Bundle bauen (App-Target)
        run: pnpm --filter @stoqr/web run build:app

      # Android-Plattform-Ordner wird in CI generiert (nicht im Repo eingecheckt),
      # damit das Repo frei von generiertem Scaffolding bleibt. Idempotent: cap add
      # ueberspringt, wenn android/ schon existiert.
      - name: Capacitor Android-Plattform generieren + syncen
        working-directory: apps/web
        run: |
          set -euo pipefail
          if [ ! -d android ]; then
            pnpm exec cap add android
          fi
          pnpm exec cap sync android

      # Permissions ins RELEASE-Manifest injizieren (idempotenter grep-Guard).
      # CAMERA (Barcode/OCR-Scan) + REQUEST_INSTALL_PACKAGES (APK-Update).
      # INTERNET erst fuer den spaeteren Sync (Phase 2) noetig - Capacitor setzt
      # INTERNET ohnehin per Default; wir sichern CAMERA/INSTALL explizit ab.
      - name: Android-Permissions ins Manifest injizieren
        working-directory: apps/web
        run: |
          set -euo pipefail
          MANIFEST=android/app/src/main/AndroidManifest.xml
          test -f "$MANIFEST"
          add_perm() {
            local perm="$1"
            if ! grep -q "android.permission.$perm" "$MANIFEST"; then
              sed -i "s#</manifest>#    <uses-permission android:name=\"android.permission.$perm\"/>\n</manifest>#" "$MANIFEST"
              echo "added $perm"
            else
              echo "$perm already present"
            fi
          }
          add_perm CAMERA
          add_perm REQUEST_INSTALL_PACKAGES
          echo '--- uses-permission im Release-Manifest ---'
          grep 'uses-permission' "$MANIFEST" || true

      # versionCode/versionName aus dem Git-Tag ableiten. Ohne diesen Schritt
      # bleiben beide auf dem Capacitor-Default (versionCode 1 / versionName "1.0")
      # stehen -> jedes Release traegt dieselbe versionCode und Android verweigert
      # das Update (INSTALL_FAILED_VERSION_DOWNGRADE bzw. kein Update erkannt).
      # versionName = Tag ohne fuehrendes 'v'; versionCode = X*10000 + Y*100 + Z
      # (monoton steigend, solange Minor/Patch < 100 bleiben).
      - name: versionCode/versionName aus Tag ableiten
        working-directory: apps/web
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, pathlib, sys
          ref = os.environ["REF_NAME"]
          m = re.match(r'^v?(\d+)\.(\d+)\.(\d+)', ref)
          if not m:
              print(f"::error::Tag '{ref}' ist kein SemVer (vX.Y.Z)"); sys.exit(1)
          major, minor, patch = (int(g) for g in m.groups())
          if minor >= 100 or patch >= 100:
              print(f"::error::minor/patch >= 100 sprengt versionCode-Schema ({ref})"); sys.exit(1)
          version_name = f"{major}.{minor}.{patch}"
          version_code = major * 10000 + minor * 100 + patch
          groovy = pathlib.Path("android/app/build.gradle")
          src = groovy.read_text()
          src, nc = re.subn(r'versionCode\s+\d+', f'versionCode {version_code}', src, count=1)
          src, nn = re.subn(r'versionName\s+"[^"]*"', f'versionName "{version_name}"', src, count=1)
          if nc == 0 or nn == 0:
              print(f"::error::versionCode/versionName nicht gefunden (nc={nc}, nn={nn})"); sys.exit(1)
          groovy.write_text(src)
          print(f"versionCode {version_code}, versionName {version_name}")
          PY

      # Release-Signierung: Keystore aus GitHub-Secrets rekonstruieren und eine
      # signingConfig in das (von cap add generierte) build.gradle injizieren.
      # Ohne diesen Schritt signiert Gradle mit dem WECHSELNDEN Debug-Key ->
      # Updates scheitern (INSTALL_FAILED_UPDATE_INCOMPATIBLE). Fehlt das
      # Keystore-Secret ODER passen Passwort/Alias nicht, faellt der Schritt auf
      # Debug-Signierung zurueck (Build bleibt gruen, APK ist installierbar, aber
      # Update erfordert Deinstallieren), statt spaeter hart in :app:packageRelease
      # mit KeytoolException zu failen. Idempotent.
      - name: Release-Signierung einrichten
        id: signing
        working-directory: apps/web
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # Default: nicht release-signiert. Wird auf true gesetzt, sobald der
          # Keystore verifiziert und die signingConfig injiziert ist.
          echo "signed=false" >> "$GITHUB_OUTPUT"
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 fehlt -> APK wird debug-signiert (installierbar, Update erfordert Deinstallieren)."
            exit 0
          fi

          # 1) Keystore rekonstruieren (nie geloggt).
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.jks

          # 1b) Keystore + Passwort + Alias VOR der Gradle-Injektion validieren.
          #     Schlaegt das fehl (falsches Passwort/Alias, korruptes base64), NICHT
          #     hart failen, sondern Release-Signierung ueberspringen -> Debug-Fallback.
          #     keytool-Ausgabe verwerfen (koennte Zertifikatsdetails zeigen; kein Secret,
          #     aber unnoetig im Log). exit 0 => Debug-Build-Fallback (signed=false).
          if ! keytool -list \
                -keystore android/app/release.jks \
                -storepass "${ANDROID_KEYSTORE_PASSWORD}" \
                -alias "${ANDROID_KEY_ALIAS}" >/dev/null 2>&1; then
            echo "::warning::Keystore/Passwort/Alias nicht verifizierbar (KeytoolException-Ursache) -> APK wird debug-signiert. Bitte ANDROID_KEYSTORE_PASSWORD/ANDROID_KEY_ALIAS/ANDROID_KEYSTORE_BASE64 pruefen."
            rm -f android/app/release.jks
            exit 0
          fi
          echo "keystore verified (alias + storepass ok)"

          # 2) key.properties schreiben (Werte aus Secrets, nicht im Log).
          cat > android/key.properties <<EOF
          storeFile=release.jks
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF

          # 3) signingConfig in build.gradle (Capacitor = Groovy-DSL) idempotent
          #    injizieren. Python-basiert -> robuster als sed fuer mehrzeilige Bloecke.
          python3 - <<'PY'
          import re, pathlib, sys
          groovy = pathlib.Path("android/app/build.gradle")
          if not groovy.exists():
              print("::error::android/app/build.gradle nicht gefunden"); sys.exit(1)
          src = groovy.read_text()
          if 'release.jks' in src:
              print("release signing already configured (groovy)"); sys.exit(0)
          header = (
              'def keystoreProperties = new Properties()\n'
              'def keystorePropertiesFile = rootProject.file("key.properties")\n'
              'if (keystorePropertiesFile.exists()) {\n'
              '    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }\n'
              '}\n'
          )
          src = header + src
          sign_block = (
              '\n    signingConfigs {\n'
              '        release {\n'
              '            keyAlias keystoreProperties["keyAlias"]\n'
              '            keyPassword keystoreProperties["keyPassword"]\n'
              '            storeFile file(keystoreProperties["storeFile"])\n'
              '            storePassword keystoreProperties["storePassword"]\n'
              '        }\n'
              '    }\n'
          )
          src = re.sub(r'android\s*\{', 'android {' + sign_block, src, count=1)
          # release-buildType auf die release-signingConfig umstellen. Aeltere
          # Capacitor-Templates generierten 'signingConfig signingConfigs.debug'
          # im release-Block; Capacitor 8 hat KEINE signingConfig-Zeile im
          # release {}-Block. Beide Faelle abdecken:
          #   - existiert die debug-Zeile: ersetzen.
          #   - sonst: 'signingConfig signingConfigs.release' direkt nach
          #     'release {' im buildTypes-Block einfuegen.
          if re.search(r'signingConfig\s+signingConfigs\.debug', src):
              src = re.sub(
                  r'signingConfig\s+signingConfigs\.debug',
                  'signingConfig signingConfigs.release',
                  src, count=1)
          else:
              # 'buildTypes { ... release {' -> nur den release-Block im
              # buildTypes-Kontext treffen (nicht den signingConfigs.release-Block).
              src, n = re.subn(
                  r'(buildTypes\s*\{[^}]*?release\s*\{)',
                  r'\1\n            signingConfig signingConfigs.release',
                  src, count=1, flags=re.DOTALL)
              if n == 0:
                  print("::error::release-buildType nicht gefunden (build.gradle-Template unerwartet)")
                  sys.exit(1)
          groovy.write_text(src)
          out = groovy.read_text()
          assert 'signingConfigs.release' in out, "groovy inject failed (signingConfigs block)"
          assert 'signingConfig signingConfigs.release' in out, "groovy inject failed (release buildType)"
          print("release signing configured (groovy)")
          PY
          # Python (set -e) ist durchgelaufen -> Release-Signierung aktiv.
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Release-APK bauen (Gradle assembleRelease/Debug)
        working-directory: apps/web/android
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          if [ "${SIGNED}" = "true" ]; then
            echo "release signing aktiv -> assembleRelease"
            ./gradlew assembleRelease
          else
            # Kein gueltiger Keystore -> Debug-Variante bauen. Sie ist mit dem
            # Android-Debug-Key signiert und damit direkt installierbar (im
            # Gegensatz zu einer unsignierten Release-APK). Updates erfordern
            # spaeter einmaliges Deinstallieren, sobald echte Release-Signierung
            # greift.
            echo "::warning::Keine gueltige Release-Signierung -> Debug-APK (installierbar, aber Update erfordert Deinstallieren)."
            ./gradlew assembleDebug
          fi

      - name: APK umbenennen (mit Version)
        working-directory: apps/web
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ "${SIGNED}" = "true" ]; then
            APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n1)
            SUFFIX=""
          else
            APK=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n1)
            SUFFIX="-debug"
          fi
          test -n "$APK"
          cp "$APK" "dist/stoqr-android-${GITHUB_REF_NAME}${SUFFIX}.apk"
          echo "APK: dist/stoqr-android-${GITHUB_REF_NAME}${SUFFIX}.apk"

      - name: GitHub Release mit APK erstellen
        uses: softprops/action-gh-release@v2
        with:
          files: apps/web/dist/*.apk
          generate_release_notes: true
          body: |
            ## stoqr Android ${{ github.ref_name }}

            Eigenstaendige Offline-App. Automatisch gebaut und getestet via GitHub Actions.

            **Installation:** APK herunterladen und auf dem Android-Geraet oeffnen
            (Installation aus unbekannten Quellen ggf. erlauben).

            Voll offline nutzbar: Anlegen, Barcode-Scan, Vorrat/Bedarf. Optionaler
            bidirektionaler Sync mit der Pi-Instanz ist in Vorbereitung (Phase 2-4),
            das fuehrende System ist dann waehlbar.

            Alle Tests und Typechecks sind vor dem Build gruen durchgelaufen.
